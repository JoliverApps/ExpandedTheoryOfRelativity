name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - 'scripts/build.py'
      - '.nojekyll'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - 'scripts/build.py'
      - '.nojekyll'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate and package the web manuscript
        run: python3 scripts/build.py
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
