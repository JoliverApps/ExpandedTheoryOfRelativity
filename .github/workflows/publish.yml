name: Publish manuscript

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'
      - 'scripts/**'
      - 'web/**'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - '**.tex'
      - '**.bib'
      - 'scripts/**'
      - 'web/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install TeX and HTML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk latexml texlive-latex-extra texlive-publishers texlive-science texlive-fonts-recommended ghostscript python3-lxml
      - name: Build PDF and HTML
        run: python3 scripts/build.py
      - name: Save generated editions
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ExpandedTheoryOfRelativity.pdf index.html assets/
          if ! git diff --cached --quiet; then
            git commit -m "Build PDF and HTML manuscript editions"
            git push
          fi
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
